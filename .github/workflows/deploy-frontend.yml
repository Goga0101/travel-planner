# Builds the Angular app and publishes it to GitHub Pages (project site: https://<user>.github.io/travel-planner/).
# The API is not hosted here. The site calls the URL in frontend/travel-planner-web/gh-pages-api-url.txt
# (scripts/start-public-api.ps1 updates it with the current Cloudflare tunnel); the repository variable
# API_BASE_URL (Settings > Secrets and variables > Actions > Variables) overrides it.
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/travel-planner-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/travel-planner-web/package-lock.json

      - run: npm ci

      - run: npx ng test --watch=false

      - run: npm run build:gh-pages
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/travel-planner-web/dist/travel-planner-web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
